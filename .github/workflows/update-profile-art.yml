name: Update profile art

# Refreshes the contribution graph SVG daily from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC (09:17 TR) every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # profile activity is private, so the public calendar is empty: count
      # commits across private repos instead. needs a fine-grained PAT with
      # read access to all repos (Contents + Metadata), saved as the
      # PROFILE_TOKEN repo secret. without it, the step is skipped.
      - name: Count real commits across all repos
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
